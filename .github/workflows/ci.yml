name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Core importable without heavy extras
        run: |
          uv run --no-dev python -c "import dungeonmind"

      - name: Unit tests
        run: uv run pytest -m "not integration"

  benchmark-smoke:
    # Informational R.2a benchmark smoke: proves the harness executes and the
    # deterministic digest preflight passes. No latency/memory thresholds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Benchmark smoke (tiny graph, fast mode)
        run: uv run python benchmarks/world_graph_reads.py --sizes 100 --fast -o benchmark-smoke.json

      - name: Upload benchmark smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-graph-read-benchmark-smoke
          path: benchmark-smoke.json
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_DB: dungeonmind
          POSTGRES_USER: dungeonmind
          POSTGRES_PASSWORD: dungeonmind-ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d dungeonmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUNGEONMIND_DATABASE_URL: postgresql://dungeonmind:dungeonmind-ci@localhost:5432/dungeonmind
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked, postgres + api extras)
        run: uv sync --locked --extra postgres --extra api

      - name: Type check PostgreSQL adapters
        run: uv run pyright src/dungeonmind/infrastructure/postgres

      - name: Type check service host
        run: uv run pyright src/dungeonmind/service

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration
