[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dungeonmind"
version = "0.1.0"
description = "Governed context and knowledge runtime for persistent fictional worlds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# PostgreSQL/pgvector substrate (PR B). Never required to import dungeonmind core.
postgres = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]
# FastAPI service host (PR B.1a). Never required to import dungeonmind core.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.390",
    # Benchmark harness only (benchmarks/); never imported by dungeonmind core.
    "pyperf>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dungeonmind", "src/dungeonmind_dnd"]

[tool.hatch.build.targets.wheel.force-include]
"src/dungeonmind_dnd/profiles/dnd5e-v1.json" = "dungeonmind_dnd/profiles/dnd5e-v1.json"
"src/dungeonmind_dnd/profiles/dnd5e-v2.json" = "dungeonmind_dnd/profiles/dnd5e-v2.json"
"src/dungeonmind_dnd/profiles/dnd5e-v3.json" = "dungeonmind_dnd/profiles/dnd5e-v3.json"
"src/dungeonmind_dnd/vocabularies/threat-v1.json" = "dungeonmind_dnd/vocabularies/threat-v1.json"
"src/dungeonmind_dnd/vocabularies/world-object-v1.json" = "dungeonmind_dnd/vocabularies/world-object-v1.json"
"src/dungeonmind_dnd/vocabularies/world-object-v2.json" = "dungeonmind_dnd/vocabularies/world-object-v2.json"
"src/dungeonmind_dnd/vocabularies/world-object-v3.json" = "dungeonmind_dnd/vocabularies/world-object-v3.json"
"src/dungeonmind_dnd/vocabularies/world-object-v4.json" = "dungeonmind_dnd/vocabularies/world-object-v4.json"
"src/dungeonmind_dnd/vocabularies/world-property-v1.json" = "dungeonmind_dnd/vocabularies/world-property-v1.json"
"src/dungeonmind_dnd/vocabularies/world-property-v2.json" = "dungeonmind_dnd/vocabularies/world-property-v2.json"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
# ANN401: JSON payloads and diagnostics maps intentionally use Any; canonical JSON
# hashing must accept arbitrary JSON values.
# RUF012: pydantic models deep-copy mutable defaults per instance; the rule targets
# plain classes where `= []` is shared state. Every model here inherits DungeonMindModel.
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL+pgvector instance (opt-in; skipped by default)",
    "conformance: behavior pinned against DungeonMindBuddy-derived fixtures",
]

[tool.pyright]
include = ["src"]
# PostgreSQL adapters require the optional ``postgres`` extra; typed in the
# integration CI job after ``uv sync --extra postgres``.
exclude = [
    "**/__pycache__",
    "src/dungeonmind/infrastructure/postgres",
    # Optional ``api`` extra; typed in the integration CI job.
    "src/dungeonmind/service/api.py",
    "src/dungeonmind/service/bootstrap.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
